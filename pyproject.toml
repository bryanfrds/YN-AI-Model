[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yn-model"
version = "0.0.1"
description = "Small, fast decision model: answers true/false or picks from a list, with confidence."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14",
    "transformers>=5.17",
    "sentencepiece",
    "protobuf",
    "mcp>=2.2,<3",
    "numpy",
    "typing_extensions",
]

[project.optional-dependencies]
dev = ["pytest"]
# Running an exported model. Lighter and faster on CPU than torch; see
# yn/onnx_backend.py for the measurements.
onnx = ["onnxruntime>=1.17", "tokenizers>=0.15"]
# Producing the export. Needs torch as well, so it is not a deployment dependency.
export = ["onnx>=1.16", "onnxscript>=0.1"]

[project.scripts]
yn = "yn.cli:main"
yn-mcp = "yn.mcp_server:main"

[tool.setuptools]
packages = ["yn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads the real model (downloads ~370MB on first run)"]
